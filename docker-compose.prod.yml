# Stack completo para un servidor: Postgres + API + Web + Caddy (HTTPS).
#   cp .env.prod.example .env   (o: bash infra/scripts/init-env.sh)
#   docker compose -f docker-compose.prod.yml up -d --build
# Solo Caddy publica puertos (80/443). Postgres y la API quedan dentro de la red de Docker.
name: starboy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: starboy_db
      POSTGRES_USER: starboy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      TZ: America/Bogota
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starboy -d starboy_db"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: starboy
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: starboy_db
      DB_SSLMODE: disable
      DB_AUTO_MIGRATE: "false" # el esquema lo aplica el entrypoint (migrate), no el servidor
      DB_LOG_SQL: "false"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ./apps/web
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_INSTAGRAM_URL: ${NEXT_PUBLIC_INSTAGRAM_URL:-}
        NEXT_PUBLIC_TIKTOK_URL: ${NEXT_PUBLIC_TIKTOK_URL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
        NEXT_PUBLIC_PAYMENT_HOSTS: ${NEXT_PUBLIC_PAYMENT_HOSTS:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
